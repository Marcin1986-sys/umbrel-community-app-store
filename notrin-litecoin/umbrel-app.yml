manifestVersion: 1
id: notrin-litecoin
name: Litecoin Node
tagline: Run a Litecoin node to validate transactions.
icon: https://i.ibb.co/M22sWmM/proxy-image-4.jpg
category: Litecoin
version: "1.4.0"
port: 10102
description: >-
  ⚠️ If not working, update the IP address in the Docker Compose file,
  located at /home/umbrel/umbrel/app-data/notrin-litecoin/docker-compose.yml,
  by replacing ip_of_umbrel_server with the actual IP address of your Umbrel server.
  After making this change, you will need to restart the Litecoin node for the changes to take effect.

  Run your Litecoin node to independently store and validate every Litecoin transaction with an easy-to-use graphical interface. 
  The litecoin.conf file is located at:
  /home/umbrel/umbrel/app-data/notrin-litecoin/data
developer: NotRin7
website: https://litecoin.org
submitter: NotRin7
submission: ""
repo: https://github.com/litecoin-project/docker-litecoin-core
support: "https://github.com/NotRin7/umbrel-community-app-store/issues"
gallery:
  - https://i.ibb.co/T4FL3pQ/Screenshot-2025-01-08-185725.png
releaseNotes: "All app images are built locally, fixed GUI networking bugs, updated UI with auto-refresh and last 100 blocks support."
dependencies: []
path: ""
defaultUsername: "testuser"
defaultPassword: "testpass"
# ... (pozostała część Twojego pliku umbrel-app.yml)
defaultUsername: "testuser"
defaultPassword: "testpass"

config:
  - id: LITECOIN_RPC_PORT
    name: "RPC Port"
    description: "Port for RPC communication"
    type: "number"
    default: 9332
  - id: LITECOIN_P2P_PORT
    name: "P2P Port"
    description: "Port for P2P network"
    type: "number"
    default: 9333
  - id: LITECOIN_RPC_USER
    name: "RPC User"
    type: "text"
    default: "testuser"
  - id: LITECOIN_RPC_PASS
    name: "RPC Password"
    type: "text"
    default: "testpass"
  - id: LITECOIN_NODE_IP
    name: "Node IP"
    type: "text"
    default: "127.0.0.1"
  - id: LITECOIN_LOCALHOST_IP
    name: "Localhost IP"
    type: "text"
    default: "127.0.0.1"
