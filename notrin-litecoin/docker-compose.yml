version: '3.7'

services:
  app_proxy:
    image: nginx:alpine
    restart: always
    environment:
      APP_HOST: litecoin_node_dashboard
      APP_PORT: 80

  litecoin:
    build: ./litecoin-core-build
    container_name: litecoin
    restart: always
    ports:
      - "${LITECOIN_RPC_PORT}:${LITECOIN_RPC_PORT}"
      - "${LITECOIN_P2P_PORT}:${LITECOIN_P2P_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/home/litecoin/.litecoin
    environment:
      - LITECOIN_RPC_USER=${LITECOIN_RPC_USER}
      - LITECOIN_RPC_PASS=${LITECOIN_RPC_PASS}
    command:
      - "-printtoconsole"
      - "-server=1"
      - "-rpcuser=${LITECOIN_RPC_USER}"
      - "-rpcpassword=${LITECOIN_RPC_PASS}"
      - "-rpcallowip=0.0.0.0/0"
      - "-rpcbind=0.0.0.0"
      - "-dbcache=2048"
      - "-maxconnections=500"

  litecoin_node_rpc_flesk:
    build: ./api
    container_name: litecoin_node_rpc_flesk
    restart: always
    ports:
      - "5000:5000"
    environment:
      - RPC_IP=${LITECOIN_NODE_IP}
      - RPC_PORT=${LITECOIN_RPC_PORT}
      - RPC_USER=${LITECOIN_RPC_USER}
      - RPC_PASS=${LITECOIN_RPC_PASS}
    depends_on:
      - litecoin

  litecoin_node_dashboard:
    build: ./gui
    container_name: litecoin_node_dashboard
    restart: always
    environment:
      - API_IP=${LITECOIN_LOCALHOST_IP}
    depends_on:
      - litecoin_node_rpc_flesk
